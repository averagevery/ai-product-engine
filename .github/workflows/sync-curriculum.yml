# Pushes hand-crafted curriculum from the repo to Firestore (programmes + core_lessons + screens).
# Requires repo secret: FIREBASE_SERVICE_ACCOUNT_JSON (full service account key JSON).
name: Sync curriculum to Firestore

on:
  push:
    branches: [main]
    paths:
      - "requirements/content/programmes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # v6 / v3 run on Node 24 (GitHub is deprecating Node 20 for Actions)
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install dependencies
        run: npm ci

      - name: Sync curriculum
        run: npm run sync-curriculum
