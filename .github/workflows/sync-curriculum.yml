# Pushes hand-crafted core lessons from the repo to Firestore (core_lessons + screens).
# Requires repo secret: FIREBASE_SERVICE_ACCOUNT_JSON (full service account key JSON).
name: Sync curriculum to Firestore

on:
  push:
    branches: [main]
    paths:
      - "requirements/content/programmes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install dependencies
        run: npm ci

      - name: Sync curriculum
        run: npm run sync-curriculum
